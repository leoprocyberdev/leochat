<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LeoChat Room</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Header Area -->
        <div class="top-bar">
            <div class="header-left">
                <a href="dashboard.html" class="back-btn">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <div class="group-avatar">Chat</div>
                <div class="group-meta">
                    <span class="group-name">Loading...</span>
                    <span class="group-status">Offline</span>
                </div>
            </div>
            <div class="header-right">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.57c-2.83-1.48-5.13-3.79-6.61-6.62l1.58-1.58c.28-.28.36-.67.24-1.02-.37-1.11-.57-2.3-.57-3.54 0-.55-.45-1-1-1H4.03c-.55 0-1 .45-1 1 0 9.39 7.63 17.02 17 17.02.55 0 1-.45 1-1v-3.59c0-.55-.45-1-1-1z"/></svg>
                <svg id="logoutBtn" class="icon-svg" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </div>

        <!-- Dynamic Pinned Banner (Hidden by default; toggled dynamically by js/chat.js) -->
        <div class="pinned-banner" style="display: none;">
            <svg class="icon-svg pin-icon" viewBox="0 0 24 24"><path d="M16 12V4h1v-2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
            <span class="pinned-text"></span>
        </div>
        
        <!-- Dynamic Scrollable Message Feed -->
        <div class="messages-container" id="messagesContainer"></div>
        
        <!-- Bottom Entry Panel -->
        <form id="chatForm" class="bottom-bar">
            <div class="input-pill">
                <!-- Emoji Icon -->
                <svg class="icon-svg pill-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                
                <!-- Text Input -->
                <input type="text" id="messageInput" placeholder="Message" autocomplete="off">
                
                <!-- Paperclip / Attachment Icon -->
                <svg class="icon-svg pill-icon" id="attachBtn" style="cursor: pointer;" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-3.31 2.69-6 6-6s6 2.69 6 6v10c0 4.42-3.58 8-8 8s-8-3.58-8-8V6h2v9c0 3.31 2.69 6 6 6s6-2.69 6-6V5c0-2.21-1.79-4-4-4s-4 1.79-4 4v11.5c0 1.1.9 2 2 2s2-.9 2-2V6h2z"/></svg>
                
                <!-- User/Contact Icon -->
                <svg class="icon-svg pill-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                
                <!-- Hidden File Input for ImgBB Uploads -->
                <input type="file" id="chatImageInput" accept="image/*" style="display: none;">
            </div>

            <!-- Send / Voice Action Button -->
            <button type="submit" class="action-fab" id="actionBtn">
                <svg id="btnSvg" viewBox="0 0 24 24" style="width:22px; height:22px; fill:white;"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            </button>
        </form>
    </div>

    <script type="module" src="js/chat.js"></script>
</body>

    </div>

    <script type="module" src="js/chat.js"></script>
</body>
</html>
