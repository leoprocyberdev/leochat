<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeoChat - Login</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1b2a">
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1 id="mainTitle">LeoChat</h1>
            <p id="subTitle">Sign in to your account</p>
        </div>

        <div id="errorLog" class="error-container"></div>

        <form id="authForm">
            <div class="form-group hidden" id="usernameFieldGroup">
                <input type="text" id="usernameInput" placeholder="Username">
            </div>
            <div class="form-group">
                <input type="email" id="emailInput" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="Password" required>
            </div>
            <button type="submit" id="submitBtn" class="action-btn">Log In</button>
        </form>

        <div class="toggle-container">
            <span id="toggleText">Don't have an account?</span>
            <span class="toggle-link" id="toggleLink">Register here</span>
        </div>
    </div>

    <script type="module" src="js/auth.js?v=1.2"></script>
    
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker registered successfully!', reg))
        .catch((err) => console.error('Service Worker registration failed:', err));
    });
  }
</script>

</body>
</html>
